name: Build Vite Game EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install --save-dev electron electron-builder
      - run: npm run build
      - run: npx electron-builder --win portable --config.appId=com.baldi.game --config.productName=BaldisClone --config.directories.output=release --config.files="dist/**/*" --config.files="main.js" --config.extraMetadata.main=main.js
      - uses: actions/upload-artifact@v4
        with:
          name: Baldi-Game-EXE
          path: release/*.exe
